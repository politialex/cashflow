name: Release Cashflow Studio

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@politialex'
      - name: Match tag to package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Archive the static site and npm package
        run: |
          (cd dist && zip -r ../cashflow-studio-site.zip .)
          npm pack
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" cashflow-studio-site.zip politialex-cashflow-studio-*.tgz --clobber
          else
            gh release create "$tag" cashflow-studio-site.zip politialex-cashflow-studio-*.tgz --verify-tag --generate-notes
          fi
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          package="@politialex/cashflow-studio@${GITHUB_REF_NAME#v}"
          if npm view "$package" version >/dev/null 2>&1; then
            echo "This package version is already published."
          else
            npm publish politialex-cashflow-studio-*.tgz
          fi
